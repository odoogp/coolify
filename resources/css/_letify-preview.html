<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/letify-light.css" />
<style>
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
  .stage { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .app-sidebar { padding: 16px; }
  .menu-item { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; text-decoration: none; }
  main { padding: 32px; }
  .row { display: flex; gap: 12px; margin: 16px 0; }
</style>
</head>
<body>
<div class="stage">
  <nav class="app-sidebar">
    <a class="menu-item menu-item-active" href="#"><span class="menu-item-icon">▣</span> Destinos</a>
    <a class="menu-item" href="#"><span class="menu-item-icon">▢</span> Servidores</a>
  </nav>
  <main class="min-h-screen">
    <h1>Destinos</h1>
    <div class="empty-state" style="padding:32px;text-align:center">
      <h2>Aún no hay destinos</h2>
      <p>Conecta tu primer endpoint Docker.</p>
      <div class="row" style="justify-content:center">
        <button class="button button-highlighted" type="button">Crear destino</button>
        <button class="button" type="button">Documentación</button>
      </div>
    </div>
    <div data-callout="info" style="margin-top:16px;padding:12px">Info lavanda</div>
  </main>
</div>
</body>
</html>
