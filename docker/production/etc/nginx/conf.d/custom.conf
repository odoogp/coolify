# Custom nginx configuration

# Disable access logs
access_log off;

# Compress text responses (HTML is always included). Without this the
# dashboard HTML and the Vite bundle travel uncompressed (~500 KB / ~380 KB).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;
