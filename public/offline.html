<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b2c6f">
    <title>GPSH</title>
    <style>
        :root {
            color-scheme: light;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: #f6f4f1;
            color: #1d1d1f;
        }

        main {
            width: min(24rem, calc(100% - 2.5rem));
            text-align: center;
        }

        svg {
            width: 4rem;
            height: 4rem;
        }

        h1 {
            margin: 1.25rem 0 0.5rem;
            font-size: 1.75rem;
            letter-spacing: -0.03em;
        }

        p {
            margin: 0;
            line-height: 1.5;
            color: #3a3a3c;
        }

        button {
            margin-top: 1.5rem;
            min-height: 2.75rem;
            padding: 0 1.25rem;
            border: 0;
            border-radius: 999px;
            background: #1b2c6f;
            color: #ffffff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#6d28d9"/>
            <path fill="#ffffff" d="M16.2 7.2c-3.7 0-6.4 2.2-6.4 5.5 0 2.1 1.2 3.6 3.2 4.3l2.2.8c1.1.4 1.6.8 1.6 1.6 0 .9-.9 1.5-2.2 1.5-1.5 0-2.6-.7-3.1-1.8l-2.3 1.2c.9 2 2.9 3.3 5.5 3.3 3.6 0 6.1-2.1 6.1-5.3 0-2.2-1.2-3.7-3.3-4.5l-2.1-.8c-1-.4-1.5-.8-1.5-1.5 0-.8.8-1.4 2-1.4 1.3 0 2.3.6 2.8 1.6l2.2-1.2c-.8-1.9-2.7-3.3-5.2-3.3Z"/>
        </svg>
        <h1>GPSH</h1>
        <p>No hay conexión. El panel no se guarda en este dispositivo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
